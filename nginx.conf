server {
    listen ${PORT};
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    include /etc/nginx/mime.types;

    # try_files sends a 301 to add a trailing slash. Absolute redirects would be
    # built from this container's plain HTTP listener and its internal port, so
    # behind the platform's TLS proxy they would point at http://host:8080.
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

    # Astro emits directory URLs, Quartz emits both page.html and page/index.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Astro fingerprints these filenames, so they can never go stale.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The generated notes ship their own 404 page.
    location /notes/ {
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /notes/404.html;
    }

    error_page 404 /404.html;
}
